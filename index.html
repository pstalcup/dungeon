<html>
	<script>
		const W = 640; 
		const H = 480;

		const CW = 20;
		const CH = 20;

		let keys = {};

		window.addEventListener('keydown', (event) => {
			if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
				event.preventDefault();
				keys[event.key] = true; 
			}
		}); 
		window.addEventListener('keyup', (event) => {
			if(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.key)) {
				event.preventDefault();
				keys[event.key] = false; 
			}
		}); 

		window.onload = () => {
			const canvas = document.getElementById("canvas"); 
			const ctx = canvas.getContext("2d"); 

			let state = "game"; 

			canvas.addEventListener('click', (event) => {
				if (state === "game") {
					state = "paused"; 
				}
				else if (state === "paused") {
					state = "game"; 
				}
				else if (state === "dead") {
					init(); 
				}
			}); 
			
			const fruitMax = 5; 
			const fruitSpeed = 0.0005;
			let nextFruit = 0; 

			let fruitX = []; 
			let fruitY = []; 

			let speed = 0.01; 
			let length = 3; 

			let px = 0; 
			let py = 0; 
			
			let tailX = [];
			let tailY = []; 

			let dx = 0; 
			let dy = 0; 

			function init() {
				px = Math.floor(Math.random() * W / 20); 
				py = Math.floor(Math.random() * H / 20); 
				dx = 0; 
				dy = 0;
				speed = 0.01; 


				length = 3; 
				tailX = [];
				tailY = []; 

				fruitX = [];
				fruitY = [];
				randomFruit();
				nextFruit = 0; 
				
				state = "game"; 
			}

			function randomFruit() {
				if (fruitX.length < fruitMax) {
					const candidateX = Math.floor(Math.random() * W / 20); 
					const candidateY = Math.floor(Math.random() * H / 20); 

					for(let i = 0; i < tailX.length; i++) {
						if(candidateX === tailX[i] && candidateY == tailY[i]) {
							randomFruit(); 
							return; 
						}
					}
					for(let i = 0; i < fruitX.length; i++) {
						if(candidateX === fruitX[i] && candidateY == fruitY[i]) {
							randomFruit(); 
							return; 
						}
					}
					fruitX.push(candidateX); 
					fruitY.push(candidateY); 
				}
			}

			function logic(delta) {
				// first, handle inputs

				if (keys["ArrowRight"] && dx >= 0) {
					dx = speed; 
					dy = 0; 
				}
				else if(keys["ArrowLeft"] && dx <= 0) {
					dx = -speed; 
					dy = 0; 
				}
				else if(keys["ArrowUp"] && dy <= 0) {
					dx = 0; 
					dy = -speed; 
				}
				else if(keys["ArrowDown"] && dy >= 0) {
					dx = 0; 
					dy = speed; 
				}

				// then update game state
				px += dx * delta; 
				py += dy * delta; 

				let hit = -1; 
				for(let i = 1; i < tailX.length; i++) {
					if(Math.floor(px) === tailX[i] && Math.floor(py) === tailY[i]) {
						hit = i; 
						break;
					}
				}
				if (hit !== -1) {
					state = "dead"; 
				}

				hit = -1; 
				for(let i = 0; i < fruitX.length; i++) {
					if(Math.floor(px) === fruitX[i] && Math.floor(py) === fruitY[i]) {
						hit = i; 
						break;
					}
				}
				if (hit !== -1) {
					length += 1;
					fruitX.splice(hit, 1);
					fruitY.splice(hit, 1); 
				}


				if (Math.floor(px) !== tailX[0] || Math.floor(py) !== tailY[0]) {
					tailX = [Math.floor(px), ...tailX.slice(0, length)]; 
					tailY = [Math.floor(py), ...tailY.slice(0, length)]; 
				}

				if(Math.floor(px) > W / 20) {
					px = 0;
				}
				else if(Math.floor(px) < 0) {
					px = W / 20; 
				}
				if(Math.floor(py) > H / 20) {
					py = 0; 
				}
				else if(Math.floor(py) < 0) {
					py = H / 20;
				}

				nextFruit += fruitSpeed * delta; 
				if (nextFruit >= 1) {
					nextFruit = 0; 
					randomFruit(); 
				}
			}
			function draw() {
				function fill(r, c, color) {
					ctx.strokeStyle = "white"; 
					ctx.strokeRect(r * CW, c * CH, CW, CH);
					ctx.fillStyle = color; 
					ctx.fillRect(r * CW + 1, c * CH + 1, CW - 2, CH - 2);
				}

				ctx.clearRect(0, 0, W, H);
				ctx.fillStyle = "green";
				ctx.fillRect(0, 0, W, H); 
				for(let i = 0; i < tailX.length; i++) {
					fill(tailX[i], tailY[i], "yellow"); 
				}
				for(let i = 0; i < fruitX.length; i++) {
					fill(fruitX[i], fruitY[i], "red"); 
				}
			}

			let lastTime = 0; 
			function tick(currentTime) {
				if (state === "game" && lastTime !== 0) {
					logic(currentTime - lastTime); 
				}
				draw(); 
				if(state === "paused") {
					ctx.fillStyle = "rgba(200, 200, 200, 0.75)"
					ctx.fillRect(0, 0, W, H); 
					ctx.font = "50px serif";
					ctx.fillStyle = "black"; 
					ctx.fillText("Paused", W / 2 - 100, H / 2)
				}
				if(state === "dead") {
					ctx.fillStyle = "rgba(200, 200, 200, 0.75)"
					ctx.fillRect(0, 0, W, H); 
					ctx.font = "50px serif";
					ctx.fillStyle = "black"; 
					ctx.fillText("Dead", W / 2 - 100, H / 2)
				}
				lastTime = currentTime; 
				requestAnimationFrame(tick);
			}

			init();
			requestAnimationFrame(tick);
		}
	</script>
	<body>
		<canvas id="canvas" width=640 height=480/>
	</body>
</html>
